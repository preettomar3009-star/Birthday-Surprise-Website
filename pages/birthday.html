<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Countdown ❤️</title>

   <link rel="stylesheet" href="../css/birthday.css">
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="stars" id="stars"></div>
    <div class="flowers" id="flowers"></div>

    <main class="countdown-container">

        <div class="top-heart">💗</div>

        <p class="subtitle">A SPECIAL DAY IS COMING</p>

        <h1>Happy Birthday</h1>

        <h2>My Beautiful Love ❤️</h2>

        <p class="description">
            Every moment brings us closer to your special day.
            I am waiting to make it unforgettable!
        </p>

        <div class="timer">

            <div class="time-box">
                <span id="days">00</span>
                <small>Days</small>
            </div>

            <div class="time-box">
                <span id="hours">00</span>
                <small>Hours</small>
            </div>

            <div class="time-box">
                <span id="minutes">00</span>
                <small>Minutes</small>
            </div>

            <div class="time-box">
                <span id="seconds">00</span>
                <small>Seconds</small>
            </div>

        </div>

        <p id="birthdayMessage">
            Counting every second for you! 💕
        </p>
        <button onclick="goToNextPage()" id="cakeButton">
    🎂 Open Your Birthday Cake ❤️
</button>

        <footer>
            Made With Endless Love ❤️
        </footer>

    </main>

    <script src="../js/countdown.js"></script>

</body>
</html>
